<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2b3a">
<title>カテゴリー設定 | 行きたい場所マップ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="app-header add-header">
      <a href="index.html" class="back-btn" aria-label="地図に戻る">&#8592;</a>
      <h1>カテゴリー設定</h1>
      <button type="button" id="navMenuBtn" class="nav-menu-btn" aria-label="メニュー" aria-expanded="false" aria-controls="navMenu">&#9776;</button>
      <nav id="navMenu" class="nav-menu" hidden>
        <a href="index.html">ホーム</a>
        <a href="list.html">登録済み行き先一覧</a>
        <a href="add.html">行き先登録</a>
        <a href="categories.html">カテゴリー設定</a>
      </nav>
    </header>

    <main class="main-content category-content">
      <form id="categoryForm" class="category-form">
        <div class="category-form-row">
          <label for="categoryIcon" class="category-icon-label">アイコン
            <input type="text" id="categoryIcon" placeholder="🍜" required>
          </label>
          <label for="categoryName" class="category-name-label">名前
            <input type="text" id="categoryName" placeholder="例: グルメ" required>
          </label>
        </div>
        <p class="hint">アイコンは絵文字や記号を1つ入力してください。</p>
        <div class="category-form-actions">
          <button type="submit" id="categorySaveBtn">追加</button>
          <button type="button" id="categoryCancelBtn" class="category-cancel-btn" hidden>キャンセル</button>
        </div>
      </form>

      <section class="place-list-section">
        <div class="section-header">
          <h2>登録済みカテゴリー</h2>
          <span id="categoryCount">(0)</span>
        </div>
        <p class="hint">▲▼で並び替えができます。この順番が他の画面にも反映されます。</p>
        <ul id="categoryList" class="category-list"></ul>
      </section>
    </main>
  </div>

<script src="common.js"></script>
<script src="categories.js"></script>
</body>
</html>
