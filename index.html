<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行きたい場所マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles/map.css">
</head>
<body>

  <!-- 地図本体 -->
  <div id="map"></div>

  <!-- 上部：検索バー -->
  <div class="search-bar">
    <input id="search-input" type="text" placeholder="場所名を検索">
    <button id="search-btn">検索</button>
  </div>

  <!-- 下部：操作ボタン -->
  <div class="action-bar">
    <button id="list-btn">一覧</button>
    <button id="locate-btn">現在地</button>
    <button id="clear-btn">全削除</button>
  </div>

  <!-- 検索結果パネル（下から出るシート） -->
  <div id="search-results" class="results-sheet hidden">
    <div class="results-sheet__header">
      <span>検索結果</span>
      <button id="close-results-btn">閉じる</button>
    </div>
    <div id="results-list"></div>
  </div>

  <!-- スポット登録モーダル -->
  <div id="register-modal" class="modal hidden">
    <div class="modal__content">
      <h3 class="modal__title">スポットを登録</h3>
      <input id="spot-name" type="text" placeholder="スポット名">
      <select id="spot-category">
        <option value="">カテゴリを選択</option>
        <option value="食事">食事</option>
        <option value="観光">観光</option>
        <option value="宿泊">宿泊</option>
        <option value="買い物">買い物</option>
        <option value="その他">その他</option>
      </select>
      <textarea id="spot-memo" placeholder="メモ（任意）"></textarea>
      <div class="modal__actions">
        <button id="register-cancel-btn" class="btn-cancel">キャンセル</button>
        <button id="register-save-btn" class="btn-save">登録</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
