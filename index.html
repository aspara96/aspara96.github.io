<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2b3a">
<title>いつマップ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="app-header index-header">
      <div class="header-text">
        <h1><span class="header-icon" aria-hidden="true">&#9992;</span>いつマップ</h1>
        <p class="header-subtitle">行き先を日付と場所で管理する</p>
      </div>
    </header>

    <main class="main-content">
      <div class="filter-bar">
        <div class="filter-row">
          <span class="filter-label">日付</span>
          <input type="date" id="viewDate" aria-label="表示基準日">
          <button id="todayBtn" type="button">今日</button>
          <button id="clearDateBtn" type="button">すべて</button>
        </div>
        <div class="filter-row">
          <span class="filter-label">場所</span>
          <input type="text" id="mapSearchQuery" placeholder="例: 東京タワー">
          <button type="button" id="mapSearchBtn">検索</button>
        </div>
      </div>
      <ul id="mapSearchResults" class="search-results"></ul>

      <div id="map" class="map"></div>

      <p class="map-legend">
        <span class="legend-dot legend-red" aria-hidden="true"></span>1ヶ月以内に終了
        <span class="legend-dot legend-black" aria-hidden="true"></span>期限切れ
        <span class="legend-dot legend-blue" aria-hidden="true"></span>その他
      </p>
      <a href="list.html" class="map-list-btn">行き先一覧</a>

      <section class="place-list-section">
        <div class="section-header">
          <h2>表示中の行き先</h2>
          <span id="placeCount">(0)</span>
        </div>
        <ul id="placeList" class="place-list"></ul>
        <button type="button" id="clearAllBtn" class="clear-all-btn">保存データを全て削除</button>
      </section>
    </main>

    <a href="add.html" class="fab" aria-label="場所を追加する">+</a>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="index.js"></script>
</body>
</html>
