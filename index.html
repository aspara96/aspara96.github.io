<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2b3a">
<title>行きたい場所マップ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="app-header">
      <h1><span class="header-icon" aria-hidden="true">&#9992;</span>行きたい場所マップ</h1>
      <a href="list.html" class="header-link" aria-label="登録した場所の一覧を見る">&#128203;</a>
    </header>

    <div class="date-bar">
      <span class="date-bar-icon" aria-hidden="true">&#128197;</span>
      <input type="date" id="viewDate" aria-label="表示基準日">
      <button id="todayBtn" type="button">今日</button>
      <button id="clearDateBtn" type="button">すべて</button>
    </div>

    <main class="main-content">
      <div class="map-search">
        <div class="search-row">
          <input type="text" id="mapSearchQuery" placeholder="例: 東京タワー">
          <button type="button" id="mapSearchBtn">検索</button>
        </div>
        <ul id="mapSearchResults" class="search-results"></ul>
      </div>

      <div id="map" class="map"></div>
      <p class="map-note" id="mapNote"></p>

      <section class="place-list-section">
        <div class="section-header">
          <h2>地図に表示中の場所</h2>
          <span id="placeCount">(0)</span>
        </div>
        <ul id="placeList" class="place-list"></ul>
        <button type="button" id="clearAllBtn" class="clear-all-btn">保存データを全て削除</button>
      </section>
    </main>

    <a href="add.html" class="fab" aria-label="場所を追加する">+</a>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="common.js"></script>
<script src="index.js"></script>
</body>
</html>
