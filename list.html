<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録済みスポット一覧</title>
  <link rel="stylesheet" href="styles/list.css">
</head>
<body>

  <header class="page-header">
    <span class="page-header__title">登録済みスポット</span>
    <button id="back-btn" onclick="location.href='index.html'">地図に戻る</button>
  </header>

  <main id="spot-list"></main>

  <script src="js/storage.js"></script>

  <script src="js/list.js"></script>

  <script>
    // デバッグ用：画面に状態を表示
    window.addEventListener('DOMContentLoaded', () => {
      const debugEl = document.createElement('div');
      debugEl.style = 'padding:16px;font-size:14px;background:#fff;';

      const storageLoaded = typeof SpotStorage !== 'undefined';
      const rawData = localStorage.getItem('wantToGoSpots');
      const spots = storageLoaded ? SpotStorage.getAll() : [];

      debugEl.innerHTML = `
        <b>デバッグ情報</b><br>
        storage.js 読み込み: ${storageLoaded ? '✅' : '❌'}<br>
        LocalStorage生データ: ${rawData ?? '(なし)'}<br>
        スポット件数: ${spots.length}
      `;
      document.body.appendChild(debugEl);
    });
  </script>

</body>
</html>
