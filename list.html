<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d2b3a">
<title>登録した場所一覧 | 行きたい場所マップ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="app-header add-header">
      <a href="index.html" class="back-btn" aria-label="地図に戻る">&#8592;</a>
      <h1>登録した場所一覧</h1>
    </header>

    <main class="main-content list-content">
      <section class="place-list-section">
        <div class="section-header">
          <h2>すべての場所</h2>
          <span id="placeCount">(0)</span>
        </div>
        <ul id="placeList" class="place-list"></ul>
        <button type="button" id="clearAllBtn" class="clear-all-btn">保存データを全て削除</button>
      </section>
    </main>

    <a href="add.html" class="fab" aria-label="場所を追加する">+</a>
  </div>

<script src="common.js"></script>
<script src="list.js"></script>
</body>
</html>
